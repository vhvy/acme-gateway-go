services:
  acme-gateway-go:
    image: ghcr.io/vhvy/acme-gateway-go:master
    container_name: acme-gateway-go
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 48952:48952
    cap_add:
      - NET_ADMIN